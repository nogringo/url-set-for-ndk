name: url_set_for_ndk
description: >-
  Relay and Blossom server sets for the ndk package, described rather than
  listed so they can be persisted offline and resolved later from the NIP-65,
  NIP-17, NIP-37 and BUD-03 lists accounts publish.
version: 0.2.0
repository: https://github.com/nogringo/url-set-for-ndk
issue_tracker: https://github.com/nogringo/url-set-for-ndk/issues

topics:
  - nostr
  - ndk
  - blossom
  - offline-first

environment:
  sdk: ^3.11.5

dependencies:
  ndk: '>=0.10.0-dev.7 <0.12.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
